<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CineBusca{% endblock %} · CineBusca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ request.url_for('static', path='styles.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">🎬 CineBusca</a>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link{% if active == 'search' %} active{% endif %}" href="/">Buscar</a></li>
        <li class="nav-item"><a class="nav-link{% if active == 'catalog' %} active{% endif %}" href="/catalog">Catálogo</a></li>
        <li class="nav-item"><a class="nav-link{% if active == 'import' %} active{% endif %}" href="/import">Importar</a></li>
      </ul>
    </div>
  </nav>

  <main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-body-secondary py-3 small border-top">
    Datos de películas: <a href="https://www.omdbapi.com/" target="_blank" rel="noopener">OMDb API</a>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
